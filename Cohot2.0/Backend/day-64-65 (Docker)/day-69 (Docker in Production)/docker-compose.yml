services: 
  backend: 
    build: ./Backend
    ports: 
      - "3000:3000"
    volumes:
      - ./Backend:/app # Bind Mount Performed
      - Backend_node_modules:/app/node_modules # Volumes Performed
    command: npx nodemon -L server.js
  frontend: 
    build: ./Frontend
    ports: 
      - "5173:5173"
    volumes: 
      - ./Frontend:/app # Bind Mount Performed
      - Frontend_node_modules:/app/node_modules # Volumes Performed
    command: npm run dev

# Listing all the volumes names we used in this        
volumes: 
  Backend_node_modules: 
  Frontend_node_modules:

# Volumes: Volumes are managed by docker, no involvement of host machine 

# Bind Mounts: Maps/Link a specific host file/directory to a container path, Useful for mounting source code for live development, where code changes on the host immediately reflect in the container

# docker compose up -> This will create 2 images and 2 containers
# docker compose down -> Used to down running container
# docker compose up --build -> This will update node_modules in container by creating new images again if any new packages are added in host machine